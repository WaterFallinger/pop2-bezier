[package]
name = "gpu_anime_vectorizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "POP 2 three-stage GPU image-to-primitive sequence dataset generator"

[dependencies]
wgpu = "0.19"
bytemuck = { version = "1.15", features = ["derive", "min_const_generics"] }
pollster = "0.3"
image = "0.24"
rand = "0.8"
flume = "0.11"
rayon = "1.8"
serde_json = "1"

[workspace]
